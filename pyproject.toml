[project]
name = "argus"
version = "0.10.0"
description = "Widget desktop de notificação de chamados do Jira - fica no topo, mostra novidade por status de atendimento."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["."]
python_files = ["testar_unidade_*.py", "testar_scripts.py", "testar_cor_titulo_sla.py", "testar_tooltip_pontuacao.py"]

[tool.ruff]
line-length = 130
extend-exclude = [".venv"]

[tool.ruff.lint]
# Nomes indefinidos, imports sem uso e afins; estilo fica a critério de cada arquivo.
select = ["F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.setuptools.package-data]
argus = ["assets/*.png", "assets/*.ico"]
