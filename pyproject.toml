[project]
name = "argus"
version = "0.1.0"
description = "Widget desktop de notificação de chamados do Jira - fica no topo, mostra novidade por status de atendimento."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argus*"]
